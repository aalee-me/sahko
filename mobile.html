<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sähkö · Mobile demo</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#08090a;color:#fffef7}.presenter{display:flex;align-items:center;justify-content:center;gap:64px;min-height:100dvh;padding:32px}.phone-stage{width:402px;height:874px;flex:none;position:relative}.phone{width:402px;height:874px;border:6px solid #26282b;border-radius:48px;overflow:hidden;background:#fffef7;box-shadow:0 28px 100px #0008;transform-origin:top left}.phone iframe{display:block;border:0;width:390px;height:862px;background:#fffef7}.demo-controls{width:225px;align-self:center}.demo-controls h1{font-size:27px;font-weight:500;letter-spacing:-1px;margin:0 0 8px}.demo-controls p{font-size:13px;color:#a5acb8;line-height:1.6;margin:0 0 24px}.steps{display:flex;flex-direction:column;gap:7px}.steps button,.desktop-link{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 15px;border:1px solid #373b40;border-radius:16px;font-size:14px;text-decoration:none;background:#17191b;color:#fffef7;cursor:pointer;text-align:left}.steps button:hover,.steps button:focus-visible,.desktop-link:hover{background:#292c2e;border-color:#6d776f}.steps button[aria-current=true]{border-color:#b9a6ed;color:#d8ccfa}.steps button:disabled{opacity:.4;cursor:default}.steps button span{color:#939ba8;font-size:12px}.desktop-link{margin-top:25px;background:none}.demo-status{font-size:12px!important;min-height:35px;margin-top:18px!important}.compact-note{display:none}
@media(max-width:700px){.presenter{padding:0;display:block;min-height:100dvh}.phone-stage,.phone{width:100%;height:100dvh!important}.phone{border:0;border-radius:0;box-shadow:none;transform:none!important}.phone iframe{width:100%;height:100dvh}.demo-controls{display:none}}
</style></head><body><main class="presenter"><div class="phone-stage"><div class="phone"><iframe id="mobileApp" src="index.html?mobileDemo=1" title="Sähkö mobile prototype" allow="microphone; camera; autoplay" allowfullscreen></iframe></div></div><aside class="demo-controls"><h1>sähkö</h1><p>Mobile prototype<br>Click through inside the phone.</p><nav class="steps" aria-label="Demo checkpoints"><button data-action="home">Landing <span>01</span></button><button data-action="tasks">Tasks <span>02</span></button><button data-action="rhythm">Find your rhythm <span>03</span></button><button data-action="friends">Rooms <span>04</span></button><button data-action="session">Focus session <span>05</span></button><button data-action="break">Break <span>06</span></button><button data-action="checkin">Check-in <span>07</span></button><button data-action="recap">Session recap <span>08</span></button></nav><a class="desktop-link" href="index.html">Open desktop app <span>→</span></a><p class="demo-status" role="status">Demo checkpoints skip waiting. Shared live timers keep running.</p></aside></main><script>
const app=document.getElementById('mobileApp'),status=document.querySelector('.demo-status');function fit(){if(innerWidth<=700){document.querySelector('.phone').style.transform='';const stage=document.querySelector('.phone-stage');stage.style.width='';stage.style.height='';return;}const scale=Math.min(1,(innerHeight-48)/874);document.querySelector('.phone').style.transform='scale('+scale+')';const stage=document.querySelector('.phone-stage');stage.style.width=402*scale+'px';stage.style.height=874*scale+'px'}addEventListener('resize',fit);fit();document.querySelectorAll('[data-action]').forEach(button=>button.onclick=async()=>{try{const demo=app.contentWindow.sahkoMobileDemo;if(!demo)throw Error('The demo is still loading.');await demo.go(button.dataset.action);document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-current',String(b===button)));status.textContent=''}catch(error){status.textContent=error.message}});
</script></body></html>
